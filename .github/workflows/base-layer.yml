name: Base layer

# Every 15 minutes: is there a new ECMWF run that a target does not hold yet? Almost always there is not,
# and the job ends after the check (standard library only, no install): a few small requests to ECMWF and
# one to each target's status, which costs the target no database read. Four times a day there is: then
# Python and the GRIB decoder are installed (pip cache) and the tiles are built and uploaded.
# Once an hour the check also compares each target's list of places (a new place gets its tiles without
# waiting for the next run); the target reads every place from its database for that, so not more often.
on:
  schedule:
    # Off the hour marks, where GitHub delays scheduled jobs the most. Two entries so the job can tell
    # which one started it (github.event.schedule): the second is the hourly one with the list of places.
    - cron: "19,34,49 * * * *"
    - cron: "4 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and upload even when every target already holds the newest run
        type: boolean
        default: false

permissions:
  contents: read

# Never two at once: a run that starts while another is still uploading waits for it.
concurrency:
  group: base-layer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Repository variables (Settings > Secrets and variables > Actions > Variables).
      TARGETS: ${{ vars.TARGETS }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      LIVE_URL: ${{ vars.LIVE_URL }}
      # Repository secrets. A target without its token is skipped with a message.
      STAGING_TOKEN: ${{ secrets.STAGING_TOKEN }}
      LIVE_TOKEN: ${{ secrets.LIVE_TOKEN }}
      FORCE: ${{ inputs.force && '--force' || '' }}
      # Compare the list of places too: on the hourly trigger and on a manual run.
      CELLS: ${{ (github.event_name != 'schedule' || github.event.schedule == '4 * * * *') && '--cells' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is there a new run for any target?
        id: check
        run: python3 -m raincheck_pipeline --check $FORCE $CELLS

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.check.outputs.needed == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the GRIB decoder
        if: steps.check.outputs.needed == 'true'
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Build and upload the tiles
        if: steps.check.outputs.needed == 'true'
        run: python -m raincheck_pipeline $FORCE $CELLS
