name: Rain models

# Every 30 minutes: has any of GFS, GEFS, ICON-EU or AIFS a newer run than a target holds? Almost always
# not, and the job ends after the check (standard library only, no install): a few dozen HEAD requests
# to NOAA, DWD and ECMWF and one to each target's rain status, which costs the target no database read.
# Each model is out at its own time after its run (ICON-EU about 3.3 h, GFS 4.1 h, GEFS 4.4 h, AIFS
# 6.1 h), so a 6-hour cycle can give up to four builds; each downloads about 260 MB (GEFS is most of it)
# and takes a few minutes. Once an hour the check also compares each target's list of places.
on:
  schedule:
    # Off the hour marks (GitHub delays scheduled jobs the most there) and off the base layer's
    # minutes (4, 19, 34, 49). Two entries so the job can tell which one started it: the first is the
    # hourly one with the list of places.
    - cron: "26 * * * *"
    - cron: "56 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and upload even when every target already holds every model's newest run
        type: boolean
        default: false

permissions:
  contents: read

# Never two at once: a run that starts while another is still uploading waits for it.
concurrency:
  group: rain-models
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The base layer's repository variables and secrets: the same targets, the same pipeline token.
      TARGETS: ${{ vars.TARGETS }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      LIVE_URL: ${{ vars.LIVE_URL }}
      STAGING_TOKEN: ${{ secrets.STAGING_TOKEN }}
      LIVE_TOKEN: ${{ secrets.LIVE_TOKEN }}
      FORCE: ${{ inputs.force && '--force' || '' }}
      # Compare the list of places too: on the hourly trigger and on a manual run.
      CELLS: ${{ (github.event_name != 'schedule' || github.event.schedule == '26 * * * *') && '--cells' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is there a newer model run for any target?
        id: check
        run: python3 -m raincheck_pipeline rain --check $FORCE $CELLS

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.check.outputs.needed == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the GRIB decoder
        if: steps.check.outputs.needed == 'true'
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Build and upload the rain tiles
        if: steps.check.outputs.needed == 'true'
        run: python -m raincheck_pipeline rain $FORCE $CELLS
